version: "3.9"

# NOVA — docker-compose orchestration
# Wires up: NOVA agent + Ollama (local LLM) + ChromaDB Memory
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d

services:
  # ────────── Ollama — local LLM server ──────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: nova_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Pull the default model only if missing
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && (ollama list | grep -q 'llama3' || ollama pull llama3) && wait"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

  # ────────── ChromaDB — vector memory ───────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: nova_chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

  # ────────── NOVA agent ──────────────────────────────────────────────────
  omniparser:
    build:
      context: .
      target: runtime
    container_name: nova_omniparser
    command: ["python3", "-m", "vision.omniparser_app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    volumes:
      - ./vendor:/app/vendor
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

  nova:
    build:
      context: .
      target: runtime
    container_name: nova_agent
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      omniparser:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OMNIPARSER_SERVER_URL=http://omniparser:8000
      - NOVA_STARTUP_DELAY_SECONDS=8
    env_file:
      - .env
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./assets:/app/assets
      - ./.jarvis:/app/.jarvis
      - ./.jarvis_sessions:/app/.jarvis_sessions
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8765/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  ollama_data:
  chroma_data:
